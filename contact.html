    <main class="page-container">
        <section class="page-heading">
            <h1>Contact Me</h1>
            <p>Feel free to reach out to me through these platforms.</p>
        </section>

        <section class="contact-layout">

            <div class="content-card">
                <h2>My Contact Information</h2>

                <div class="contact-item">
                    <h3>Facebook</h3>
                    <a href="https://www.facebook.com/share/1GDaxHskBe/"
                       target="_blank" rel="noopener noreferrer">
                        Kim Eleazer
                    </a>
                </div>

                <div class="contact-item">
                    <h3>Gmail</h3>
                    <a href="mailto:kimeleazer@gmail.com">
                        kimeleazer@gmail.com
                    </a>
                </div>

                <div class="contact-item">
                    <h3>Phone Number</h3>
                    <a href="tel:09931310996">
                        09931310996
                    </a>
                </div>
            </div>

            <div class="content-card">
                <h2>Send Me a Message</h2>

                <form action="mailto:kimeleazer@gmail.com"
                      method="post" enctype="text/plain">

                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="Name"
                           placeholder="Enter your name" required>

                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="Email"
                           placeholder="Enter your email" required>

                    <label for="message">Your Message</label>
                    <textarea id="message" name="Message"
                              placeholder="Write your message"
                              rows="5" required></textarea>

                    <button type="submit">Send Message</button>
                </form>
            </div>

        </section>
